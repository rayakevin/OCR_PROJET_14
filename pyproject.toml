[project]
name = "ocr-projet-14"
version = "0.1.0"
description = "POC pédagogique de triage médical bilingue avec Qwen3, LoRA et DPO"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets==4.7.0",
    "en-core-web-sm",
    "fastapi==0.162.0",
    "fr-core-news-md",
    "httpx==0.28.1",
    "ijson>=3.6.0",
    "jinja2==3.1.6",
    "mlflow==3.17.2",
    "pandas==2.3.3",
    "peft==0.21.2",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pyarrow==25.0.0",
    "pydantic==2.14.1",
    "scikit-learn>=1.9.1",
    "spacy>=3.8.16",
    "torch>=2.15.0",
    "transformers>=5.22.1",
    "trl==1.17.1",
    "uvicorn==0.54.0",
]

[tool.uv.sources]
fr-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
